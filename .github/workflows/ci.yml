name: CI

on:
  push:
    branches: [main]
  pull_request:

# Source of truth: apps/vuencedit/.github-public/ in the private monorepo (staged by publish.sh).
# Edit it there, not here. This repo is flattened: the Cargo workspace root is the repo root.

jobs:
  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Workspace root is the repo root, so the default cache config (./target) is correct.
      - uses: swatinem/rust-cache@v2
      # Whole workspace: the app plus the shared voxel-core and eden-format crates.
      - run: cargo test --workspace
      # Advisory for now — tighten to `-D warnings` once existing lints are cleared.
      - run: cargo clippy --workspace -- -A clippy::all -D clippy::correctness

  # Windows build gate — the app targets Windows but is mostly developed on macOS. This catches
  # platform-specific breakage early (path separators, the save/rename + mmap-lock behaviour, etc.).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace
