name: Windows test build

# Manual, release-less Windows build for quick testing. Run from the Actions tab or:
#   gh workflow run windows-test.yml
# Produces a downloadable artifact (NSIS installer + portable exe); no tag, no GitHub release.

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: VuencEdit-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/eden-world-editor.exe
          if-no-files-found: error
