<!--
  A real, already-optimized image (hero + anything supplied later).
  Usage: {% raw %}{% include screenshot.html src="/assets/img/hero.webp" alt="..." width="1600" height="1134" lazy=true %}{% endraw %}
-->
<img
  src="{{ include.src | relative_url }}"
  alt="{{ include.alt }}"
  width="{{ include.width }}"
  height="{{ include.height }}"
  {% if include.lazy %}loading="lazy"{% endif %}
  style="width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.55);"
>
