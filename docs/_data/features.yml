- icon: "🗺️"
  title: "Map & navigation"
  text: >-
    A top-down map you can zoom and pan, with Z-slice, cutaway and relief shading. The 3D view,
    a tools rail and a hotbar float over it as windows.
  exp: false
- icon: "✏️"
  title: "Drawing & selection"
  text: >-
    Pen, brush, spray, shapes and a fill bucket. Select with a box, wand, lasso or polygon, and
    every edit respects the shape you picked.
  exp: false
- icon: "⛰️"
  title: "Terrain sculpting"
  text: >-
    Sixteen brush tools, from raise and smooth to hydraulic erosion, plus rock and carve, which
    work on volume instead of a height map.
  exp: true
- icon: "🧊"
  title: "3D view"
  text: >-
    Fly, orbit or mouselook through the world. Break, place, select and sculpt in 3D, with the
    same undo as the map.
  exp: false
- icon: "🔍"
  title: "Lens"
  text: >-
    A floating window with front, side and top views of your selection or paste, so you can see
    how deep it goes before you commit.
  exp: false
- icon: "🌍"
  title: "World generation"
  text: >-
    Flat, Natural, Classic and Tg2 generators, for both 64-high and 256-high worlds.
  exp: false
- icon: "📦"
  title: "Clipboard & prefabs"
  text: >-
    Copy and paste with rotate, mirror, scatter and array, plus a searchable prefab library.
  exp: false
