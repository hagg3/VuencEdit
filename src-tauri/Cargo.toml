[package]
name = "eden-world-editor"
version = "1.0.0"
description = "Eden world file editor"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eden_world_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
base64 = "0.22"
memmap2 = "0.9"
flate2 = "1"
zip = "2"
reqwest = { version = "0.12", features = ["multipart", "stream"] }
# Streamed upload bodies (audit C4): a `Stream` adapter over the compressed world file so a 2 GB
# upload costs a 256 KB buffer instead of 4-6 GB, and reports real byte progress on the way out.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
rustc-hash = "2"
crc32fast = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep incremental dev compiles fast, but optimise dependencies and (mildly) our own code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

